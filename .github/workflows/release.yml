name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Read the version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${version} in gradle.properties"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build
        run: gradle build --stacktrace
      - name: Extract the changelog section of this version
        run: |
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION}" build/libs/legacycolonies-*.jar --target "${GITHUB_SHA}" --title "Legacy Colonies ${VERSION}" --notes-file release-notes.md
