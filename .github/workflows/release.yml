name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check the tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${version} in gradle.properties"
            exit 1
          fi
      - name: Build
        run: gradle build --stacktrace
      - name: Extract the changelog section of this version
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}"
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/libs/legacycolonies-*.jar --title "Legacy Colonies ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
