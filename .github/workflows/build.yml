name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: List MineColonies versions on the LDTTeam maven
        run: curl -sS https://ldtteam.jfrog.io/ldtteam/modding/com/ldtteam/minecolonies/maven-metadata.xml | grep -o '<version>1\.1\.14[0-9]*-1\.21\.1[^<]*' | tail -n 10 || true
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: legacycolonies-jar
          path: build/libs/*.jar
